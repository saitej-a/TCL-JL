# Production topology — TCS Joining Tracker (Phase 1.2)
# D-03/D-04/D-06/D-11: TLS 1.3 nginx, no env_file (deployment env injects vars),
# NO host ports on db/redis (threat T-1.1-03), no source bind mounts.
# Placeholder certs are self-signed; Phase 10.2 owns real certs + hardening.

services:
  web:
    build: .
    command:
      ["/app/docker/entrypoint.sh", "gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "4", "--threads", "2", "--timeout", "60", "--access-logfile", "-"]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      RUN_DB_MIGRATIONS: "1"
      POSTGRES_USER: ${POSTGRES_USER:?set in deployment environment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in deployment environment}
      POSTGRES_DB: ${POSTGRES_DB:?set in deployment environment}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set in deployment environment}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import http.client; c = http.client.HTTPConnection('127.0.0.1', 8000, timeout=5); c.request('GET', '/health/ready/'); r = c.getresponse(); r.read(); assert r.status == 200, r.status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    restart: unless-stopped

  db:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in deployment environment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in deployment environment}
      POSTGRES_DB: ${POSTGRES_DB:?set in deployment environment}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  redis:
    image: redis:7.4.11-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  celery_worker:
    build: .
    command:
      ["/app/docker/entrypoint.sh", "celery", "-A", "config", "worker", "--loglevel=INFO", "--concurrency=2", "-Q", "default,notifications,maintenance"]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      POSTGRES_USER: ${POSTGRES_USER:?set in deployment environment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in deployment environment}
      POSTGRES_DB: ${POSTGRES_DB:?set in deployment environment}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set in deployment environment}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery_beat:
    build: .
    command:
      ["/app/docker/entrypoint.sh", "celery", "-A", "config", "beat", "--loglevel=INFO"]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      POSTGRES_USER: ${POSTGRES_USER:?set in deployment environment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in deployment environment}
      POSTGRES_DB: ${POSTGRES_DB:?set in deployment environment}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set in deployment environment}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./staticfiles:/var/www/static:ro
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data: {}
  redis_data: {}
