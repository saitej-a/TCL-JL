# PLACEHOLDER self-signed certs (gitignored under nginx/certs/) — Phase 10.2 hardens and
# replaces with real certificates. This conf declares the final TLS 1.3 + HSTS shape now (D-04).
# Runtime DNS resolution (127.0.0.11 = Docker embedded DNS) mirrors the dev conf.

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_protocols TLSv1.3;
    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    location /static/ {
        alias /var/www/static/;
    }

    location / {
        resolver 127.0.0.11 valid=30s;
        set $upstream_web http://web:8000;
        proxy_pass $upstream_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
