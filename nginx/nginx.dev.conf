# Dev reverse proxy (D-03): plain HTTP :80 -> web:8000. TLS only in prod conf.
# Runtime DNS resolution via Docker's embedded DNS (127.0.0.11) so nginx starts
# and recovers even if `web` is recreated or DNS is briefly cold at boot.

server {
    listen 80;
    server_name _;

    # Collectstatic output, bind-mounted per compose (shared volume in prod).
    location /static/ {
        alias /var/www/static/;
    }

    location / {
        resolver 127.0.0.11 valid=30s;
        set $upstream_web http://web:8000;
        proxy_pass $upstream_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
